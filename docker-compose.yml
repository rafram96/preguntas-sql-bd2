# BD2 - nodos para los ejercicios de postgres_fdw
# docker compose up -d
# coordinador: 5433, arequipa: 5434, trujillo: 5435 (user y pass: postgres)
# Desde el coordinador, los nodos se llaman nodo_arequipa y nodo_trujillo, puerto 5432.

services:
  coordinador:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"

  nodo_arequipa:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"

  nodo_trujillo:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
